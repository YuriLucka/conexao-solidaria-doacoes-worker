name: ci

# Requisito do enunciado: a cada push na branch principal, compilar (.NET build) e gerar a imagem Docker.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/conexao-solidaria-doacoes-worker

jobs:
  build-test-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Doacoes.slnx

      - name: Build
        run: dotnet build Doacoes.slnx -c Release --no-restore

      # Unidade + integração com PostgreSQL real via Testcontainers (o runner tem Docker).
      - name: Testes
        run: dotnet test Doacoes.slnx -c Release --no-build --logger "trx;LogFileName=resultado.trx"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagem Docker (build e push no GHCR)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
